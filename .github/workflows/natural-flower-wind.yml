name: TNOA Natural Flower Wind Source and Ecology

on:
  push:
    branches:
      - research/independent-natural-flower-wind-20261119
      - main
    paths:
      - 'research/natural_flower_wind/**'
      - '.github/workflows/natural-flower-wind.yml'
  pull_request:
    paths:
      - 'research/natural_flower_wind/**'
      - '.github/workflows/natural-flower-wind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ecological model dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Audit script syntax
        run: python -m py_compile research/natural_flower_wind/intake.py research/natural_flower_wind/audit_semantics.py research/natural_flower_wind/test_three_bee_guilds.py research/natural_flower_wind/test_amount_vs_guild.py research/natural_flower_wind/weschler_source_intake.py research/natural_flower_wind/audit_weschler_session_key.py research/natural_flower_wind/weschler_behavior_pair_test.py research/natural_flower_wind/date_block_sensitivity.py research/natural_flower_wind/within_date_fixed_effect.py
      - name: Fetch source and verify checksum, schema and effort BEFORE outcome tests
        run: python research/natural_flower_wind/intake.py
      - name: Source denominator check
        run: |
          python - <<'PY'
          import json
          p='research/natural_flower_wind/source_intake_receipt.json'
          x=json.load(open(p))
          assert x['status']=='HOLD_UNVERIFIED_HOVERFLY_COLUMN'
          assert x['source']['published_md5']=='85cc235a323d45c0fa52efcc27db9f82'
          assert not x['required_columns_missing']
          assert x['butterfly_is_a_different_taxon']
          assert x['hoverfly_candidate_columns']==[]
          print('NATURAL_FLOWER_SOURCE_INTEGRITY_PASS; FOUR_GUILD_ECOLOGY_HOLD')
          PY
      - name: Audit original source row multiplicity and pollinator guild semantics
        run: python research/natural_flower_wind/audit_semantics.py
      - name: Audit independent Wyoming natural-flower behavior archive before viewing outcomes
        run: python research/natural_flower_wind/weschler_source_intake.py
      - name: Audit video session, plant, and wind identity independently of behavior outcomes
        run: python research/natural_flower_wind/audit_weschler_session_key.py
      - name: Test natural-flower visit pollen × nectar co-occurrence in source-verified video sessions
        continue-on-error: true
        run: python research/natural_flower_wind/weschler_behavior_pair_test.py
      - name: Weschler session-based inference and semantic audit
        run: |
          python - <<'PY'
          import json
          a=json.load(open('research/natural_flower_wind/WESCHLER_BEHAVIOR_COOCCURRENCE_2026-11-19.json'))
          assert a['status']=='EXPLORATORY_ESTIMATED' or a['status'].startswith('HOLD_'),a
          if a['status']=='EXPLORATORY_ESTIMATED':
              assert a['units']['raw_interaction_rows']==472
              assert a['units']['video_sessions']>=12
              assert a['primary']['n_permutations']==999
              assert len(a['claim_limits'])>=6
              print('WESCHLER_VIDEO_BEHAVIOR_SOURCE_AND_CLAIM_GATE_PASS')
          else:
              assert 'primary' not in a, 'HOLD must not claim new biology'
              print('WESCHLER_SEMANTIC_HOLD_RETAINED', a['status'])
          PY
      - name: Run source-corrected exploratory three-bee guild ecological comparison
        continue-on-error: true
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python research/natural_flower_wind/test_three_bee_guilds.py \
            --output research/natural_flower_wind/THREE_BEE_GUILD_RESULT_2026-11-19.json \
            --permutations 999
      - name: Audit noninvented source and independent survey denominator
        run: |
          python - <<'PY'
          import json
          a=json.load(open('research/natural_flower_wind/THREE_BEE_GUILD_RESULT_2026-11-19.json'))
          assert a['status']=='EXPLORATORY_ESTIMATED',a
          assert a['scientific_role'].startswith('Retrospective')
          assert a['source']['source_rows']==496
          assert a['source']['identical_fourfold_copies'] is True
          assert a['source']['independent_source_transects_before_missing_weather']==124
          assert a['coverage']['eligible_observations']>=118
          assert len(a['identity']['categories'])==3
          assert 'hoverfly' not in a['identity']['categories']
          assert a['permutation']['n']==999
          assert a['permutation']['failed_quantity']==0
          assert a['permutation']['failed_identity']==0
          assert len(a['hard_limits'])>=8
          print('THREE_BEE_NATURAL_FLOWER_ECOLOGY_SOURCE_AND_CLAIM_GATE_PASS')
          PY
      - name: Post-result stronger within-field-date wind permutation check
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/natural_flower_wind/date_block_sensitivity.py
      - name: Date-block sensitivity provenance guard
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/natural_flower_wind/THREE_BEE_DATE_BLOCK_SENSITIVITY_2026-11-19.json'))
          assert x['scientific_role'].startswith('strictly post-result')
          assert x['source_rows']==496 and x['exact_unique_transects']==124
          assert x['n_permutations']==999
          assert x['status'] in ('EXPLORATORY_ESTIMATED','HOLD_FIELD_DATE_PERMUTATION_SUPPORT','HOLD_DESIGN_RANK','HOLD_OPTIMIZER','HOLD_PERMUTATION_OPTIMIZER')
          print('IRISH_FIELD_DATE_ADVERSE_SENSITIVITY_GATE_PASS',x['status'])
          PY
      - name: Test stricter field-date fixed-effect conditional wind association
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/natural_flower_wind/within_date_fixed_effect.py
      - name: Explicit field-date scientific hold-or-result audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/natural_flower_wind/THREE_BEE_SITE_DATE_FIXED_EFFECT_2026-11-19.json'))
          assert x['scientific_status'].startswith('post-result adversarial')
          assert x['source_sha256']=='07c902217da47953966f93319ef8db4ef1a83d7911f41c86cbe735368e7820b5'
          assert x['unique_raw_transects']==124 and x['eligible_transects']==120
          assert x['status'] in ('EXPLORATORY_ESTIMATED','HOLD_FIXED_EFFECT_RANK','HOLD_WITHIN_DAY_WIND_SUPPORT','HOLD_DATE_FIXED_EFFECT_OPTIMIZER','HOLD_NULL_OPTIMIZER','PARTIAL_COUNT_ESTIMATED_GUILD_HOLD','PARTIAL_GUILD_ESTIMATED_COUNT_HOLD')
          assert x['permutations']==999
          print('IRISH_WITHIN_DAY_FIELD_DATE_FIXED_SENSITIVITY_GUARD',x['status'])
          PY
      - name: Preserve SOURCE AUDIT only (never raw external rows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnoa-independent-flower-source-audit
          path: |
            research/natural_flower_wind/source_intake_receipt.json
            research/natural_flower_wind/SEMANTIC_AUDIT_2026-11-19.json
            research/natural_flower_wind/WESCHLER_SOURCE_INTAKE_2026-11-19.json
            research/natural_flower_wind/WESCHLER_SESSION_KEY_AUDIT_2026-11-19.json
            research/natural_flower_wind/THREE_BEE_GUILD_RESULT_2026-11-19.json
            research/natural_flower_wind/WESCHLER_BEHAVIOR_COOCCURRENCE_2026-11-19.json
            research/natural_flower_wind/THREE_BEE_DATE_BLOCK_SENSITIVITY_2026-11-19.json
            research/natural_flower_wind/THREE_BEE_SITE_DATE_FIXED_EFFECT_2026-11-19.json
          if-no-files-found: warn
          retention-days: 45
