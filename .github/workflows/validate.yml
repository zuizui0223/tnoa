name: validate-paper-package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate TNOA paper manifest
        run: python scripts/validate_paper_manifest.py
      - name: Validate post-freeze MEE synthetic consequence
        run: python scripts/validate_mee_synthetic_consequences.py
      - name: Audit manuscript claim boundaries
        run: python scripts/audit_manuscript_claims.py
      - name: Validate MEE submission package
        run: python scripts/validate_mee_submission_package.py
      - name: Build anonymous MEE manuscript source
        run: python scripts/build_mee_anonymous_manuscript.py
