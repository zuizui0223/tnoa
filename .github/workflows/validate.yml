name: validate-paper-package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate TNOA paper manifest
        run: python scripts/validate_paper_manifest.py
      - name: Validate post-freeze MEE synthetic consequence
        run: python scripts/validate_mee_synthetic_consequences.py
      - name: Validate post-freeze observation-vocabulary ablation
        run: python scripts/validate_observation_vocabulary_ablation.py
      - name: Validate prevalence and composition-weight sensitivity
        run: python scripts/validate_prevalence_weighting_sensitivity.py
      - name: Validate structural axis audit
        run: python scripts/validate_structural_axis_audit.py
      - name: Validate MEE figure data
        run: python scripts/validate_mee_figure_data.py
      - name: Install figure dependencies
        run: python -m pip install -r requirements-figures.txt
      - name: Smoke-build MEE figure panels
        run: |
          python scripts/build_mee_figures.py --output-dir /tmp/tnoa_mee_figures
          test "$(find /tmp/tnoa_mee_figures -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          test "$(find /tmp/tnoa_mee_figures -maxdepth 1 -name '*.svg' | wc -l)" -eq 8
          test -s /tmp/tnoa_mee_figures/figure_provenance.json
      - name: Build final MEE multi-panel figures
        run: |
          python scripts/build_mee_composite_figures.py --output-dir /tmp/tnoa_mee_composite
          test "$(find /tmp/tnoa_mee_composite -maxdepth 1 -name '*.png' | wc -l)" -eq 4
          test "$(find /tmp/tnoa_mee_composite -maxdepth 1 -name '*.svg' | wc -l)" -eq 4
          test -s /tmp/tnoa_mee_composite/composite_figure_provenance.json
      - name: Test minimal reusable TNOA API
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Smoke-test CSV CLI
        run: |
          python -m tnoa.cli examples/minimal_evidence.csv /tmp/tnoa_annotated.csv --summary /tmp/tnoa_summary.json --group-by site,condition
          test -s /tmp/tnoa_annotated.csv
          test -s /tmp/tnoa_summary.json
      - name: Audit manuscript claim boundaries
        run: python scripts/audit_manuscript_claims.py
      - name: Validate MEE submission package
        run: python scripts/validate_mee_submission_package.py
      - name: Build anonymous MEE manuscript source
        run: python scripts/build_mee_anonymous_manuscript.py
      - name: Build MEE initial-submission source with captions
        run: python scripts/build_mee_initial_submission_source.py
      - name: Audit initial-submission structure, citations and word count
        run: python scripts/audit_initial_submission_readiness.py
      - name: Audit active-manuscript versus prior-art reference scope
        run: python scripts/audit_reference_scope.py
      - name: Checkout pinned CSL styles for submission formatting
        uses: actions/checkout@v4
        with:
          repository: citation-style-language/styles
          ref: 2a4430b7cadae7cc88012537c5ceaed76d1d9938
          path: csl_styles
          persist-credentials: false
      - name: Install submission-formatting dependencies
        run: python -m pip install -r requirements-submission.txt
      - name: Verify pinned APA CSL blob
        run: |
          test "$(git hash-object csl_styles/apa.csl)" = "9bc45ef6289bb2f933a0fd9a44640baa34a3191e"
      - name: Build and validate anonymous MEE DOCX
        run: |
          mkdir -p /tmp/tnoa_mee_docx
          python scripts/build_mee_submission_docx.py \
            --csl csl_styles/apa.csl \
            --output /tmp/tnoa_mee_docx/TNOA_MEE_ANONYMOUS_INITIAL_SUBMISSION.docx
          python scripts/validate_mee_submission_docx.py \
            /tmp/tnoa_mee_docx/TNOA_MEE_ANONYMOUS_INITIAL_SUBMISSION.docx
          test -s submission/generated/docx_validation.json
      - name: Checkout pinned Source A for reviewer-bundle validation
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/pollipi
          ref: f3b266897f3e9139e6c3fe9ce6b645e25371e092
          path: review_sources/source_A
          persist-credentials: false
      - name: Checkout pinned Source B for reviewer-bundle validation
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/insepi
          ref: 1664a190cec47142e8d14cc5157302a7af18d019
          path: review_sources/source_B
          persist-credentials: false
      - name: Build and validate deterministic anonymous reviewer bundle
        run: |
          python scripts/build_anonymous_review_bundle.py \
            --source-a-root review_sources/source_A \
            --source-b-root review_sources/source_B \
            --output-dir /tmp/tnoa_review_bundle
          test -s /tmp/tnoa_review_bundle/TNOA_MEE_ANONYMOUS_REVIEW_BUNDLE.zip
          test -s /tmp/tnoa_review_bundle/TNOA_MEE_ANONYMOUS_REVIEW_BUNDLE.receipt.json
          python scripts/validate_anonymous_review_bundle.py /tmp/tnoa_review_bundle/TNOA_MEE_ANONYMOUS_REVIEW_BUNDLE.zip
      - name: Upload reviewer-bundle validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnoa-anonymous-review-bundle-validation
          path: |
            /tmp/tnoa_review_bundle/TNOA_MEE_ANONYMOUS_REVIEW_BUNDLE.zip
            /tmp/tnoa_review_bundle/TNOA_MEE_ANONYMOUS_REVIEW_BUNDLE.receipt.json
          retention-days: 7
      - name: Upload initial-submission readiness report
        uses: actions/upload-artifact@v4
        with:
          name: tnoa-mee-initial-submission-readiness
          path: |
            submission/generated/MEE_INITIAL_SUBMISSION_SOURCE.md
            submission/generated/initial_submission_readiness.json
            submission/generated/reference_scope_audit.json
          retention-days: 7
      - name: Upload anonymous MEE DOCX validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnoa-mee-anonymous-docx-validation
          path: |
            /tmp/tnoa_mee_docx/TNOA_MEE_ANONYMOUS_INITIAL_SUBMISSION.docx
            submission/generated/docx_validation.json
          retention-days: 7
      - name: Upload final MEE multi-panel figure validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnoa-mee-composite-figures-validation
          path: /tmp/tnoa_mee_composite/
          retention-days: 7
