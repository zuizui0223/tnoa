name: TNOA Ecology Wind Source Intake

on:
  push:
    branches:
      - research/wind-process-overlap-ecology-20261019
    paths:
      - 'research/wind_process_overlap/**'
      - '.github/workflows/wind-ecology-source-intake.yml'
  pull_request:
    paths:
      - 'research/wind_process_overlap/**'
      - '.github/workflows/wind-ecology-source-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install file readers
        run: python -m pip install openpyxl==3.1.5 numpy==2.3.5 scipy==1.17.0
      - name: Check source-audit code
        run: python -m py_compile research/wind_process_overlap/source_intake.py
      - name: Download and fingerprint original public data; inspect schema only
        run: python research/wind_process_overlap/source_intake.py --output research/wind_process_overlap/intake_receipt.json
      - name: Verify no ecological outcomes were opened
        run: |
          python - <<'PY'
          import json
          x=json.load(open("research/wind_process_overlap/intake_receipt.json"))
          assert x["status"]=="source_only_partial_or_full"
          assert len(x["original_files"])>=1
          assert any(v.get("members") or v.get("worksheets") for v in x["original_files"].values())
          print("Unavailable source paths:",list(x["source_errors"]))
          print("TNOA_WIND_INTAKE_GATE_PASS")
          PY
      - name: Audit authentic orchid-bee specimen-session keys before ecological outcomes
        run: python research/wind_process_overlap/crall_linkage_audit.py
      - name: Build source-verified session × genus matrix without opening ecological wind effects
        run: python research/wind_process_overlap/crall_derived_matrix.py
      - name: Run frozen secondary Euglossa species-by-wind test
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python research/wind_process_overlap/crall_species_wind_test.py \
            --input research/wind_process_overlap/crall_derived_session_matrix.json \
            --output research/wind_process_overlap/crall_species_wind_result.json \
            --permutations 999
      - name: Audit source-pinned ecological null result and uncertainty contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('research/wind_process_overlap/crall_species_wind_result.json'))
          assert r['status']=='EXPLORATORY_ESTIMATED'
          assert r['denominators']['named_species_eligible']==6
          assert r['denominators']['euglossa']==399
          assert r['denominators']['joined_bees']==409
          assert r['denominators']['permutable_sessions']==67
          assert r['denominators']['permutable_site_bait_groups']==9
          assert r['permutation']['n']==999
          assert r['permutation']['fit_failures']==0
          assert abs(r['model']['deviance_gain']-12.31688955)<0.002
          assert abs(r['permutation']['p_plus_one']-0.164)<0.002
          assert all(z['status']=='PASS' for z in r['leave_one_site_out'])
          assert r['model']['warning_near_separation']
          assert len(r['hard_limits'])>=5
          print('TNOA_CRALL_SPECIES_ECOLOGY_CLAIM_GATE_PASS')
          PY
      - name: Upload dataset-fingerprint and failure/schema receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnoa-wind-ecological-source-schema
          path: |
            research/wind_process_overlap/intake_receipt.json
            research/wind_process_overlap/crall_linkage_audit_receipt.json
            research/wind_process_overlap/crall_derived_session_matrix.json
            research/wind_process_overlap/crall_species_wind_result.json
          retention-days: 60
