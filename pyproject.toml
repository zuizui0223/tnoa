[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tnoa-ecology"
version = "0.1.0"
description = "Minimal process-preserving B/T/N/U decision layer for ecological sensing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TNOA contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
tnoa = "tnoa.cli:main"

[tool.setuptools.packages.find]
include = ["tnoa*"]
