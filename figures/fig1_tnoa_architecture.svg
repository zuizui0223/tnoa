<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill:#111; }
      .layer { font: 700 23px Arial, sans-serif; fill:#222; }
      .head { font: 700 20px Arial, sans-serif; fill:#111; }
      .body { font: 17px Arial, sans-serif; fill:#222; }
      .small { font: 15px Arial, sans-serif; fill:#333; }
      .mono { font: 16px Menlo, Consolas, monospace; fill:#222; }
      .box { stroke:#333; stroke-width:2; rx:16; ry:16; }
      .arrow { stroke:#333; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#777; stroke-width:2; fill:none; stroke-dasharray:8 7; }
      .forbid { stroke:#b23a2e; stroke-width:4; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="55" text-anchor="middle" class="title">TNOA: from process world to decision entitlement</text>

  <!-- Layer labels -->
  <text x="65" y="135" class="layer">1  Process world</text>
  <text x="430" y="135" class="layer">2  Evidence channels</text>
  <text x="960" y="135" class="layer">3  Decision contract</text>
  <text x="1295" y="135" class="layer">4  Claim boundary</text>

  <!-- Process world -->
  <rect x="55" y="170" width="285" height="115" class="box" fill="#f4f4f4"/>
  <text x="197" y="205" text-anchor="middle" class="head">Baseline</text>
  <text x="197" y="235" text-anchor="middle" class="body">no marked dynamic deviation</text>
  <text x="197" y="261" text-anchor="middle" class="small">outside T/N adjudication</text>

  <rect x="55" y="315" width="285" height="115" class="box" fill="#e9f4ff"/>
  <text x="197" y="350" text-anchor="middle" class="head">Target process</text>
  <text x="197" y="380" text-anchor="middle" class="body">focal biological event</text>
  <text x="197" y="406" text-anchor="middle" class="small">may drive a local response</text>

  <rect x="55" y="460" width="285" height="115" class="box" fill="#fff1e6"/>
  <text x="197" y="495" text-anchor="middle" class="head">Nuisance process</text>
  <text x="197" y="525" text-anchor="middle" class="body">mimic · mask · corrupt</text>
  <text x="197" y="551" text-anchor="middle" class="small">or degrade measurement support</text>

  <rect x="55" y="605" width="285" height="115" class="box" fill="#f2ecff"/>
  <text x="197" y="640" text-anchor="middle" class="head">Target + nuisance</text>
  <text x="197" y="670" text-anchor="middle" class="body">legitimate coexistence</text>
  <text x="197" y="696" text-anchor="middle" class="small">not automatically a classifier error</text>

  <!-- Evidence channels -->
  <rect x="405" y="170" width="465" height="550" class="box" fill="#fcfcfc"/>

  <rect x="435" y="205" width="180" height="90" class="box" fill="#dceeff"/>
  <text x="525" y="238" text-anchor="middle" class="head">T</text>
  <text x="525" y="265" text-anchor="middle" class="small">direct positive target evidence</text>

  <rect x="650" y="205" width="190" height="90" class="box" fill="#e5f7ee"/>
  <text x="745" y="238" text-anchor="middle" class="head">C</text>
  <text x="745" y="265" text-anchor="middle" class="small">response × attribution</text>

  <rect x="435" y="335" width="180" height="90" class="box" fill="#ffe6cf"/>
  <text x="525" y="368" text-anchor="middle" class="head">N</text>
  <text x="525" y="395" text-anchor="middle" class="small">positive exogenous-process evidence</text>

  <rect x="650" y="335" width="190" height="90" class="box" fill="#eee8ff"/>
  <text x="745" y="368" text-anchor="middle" class="head">O</text>
  <text x="745" y="395" text-anchor="middle" class="small">measurement support / observability</text>

  <rect x="542" y="475" width="190" height="90" class="box" fill="#f6f1d9"/>
  <text x="637" y="508" text-anchor="middle" class="head">A−  optional</text>
  <text x="637" y="535" text-anchor="middle" class="small">independent absence evidence only</text>

  <text x="637" y="615" text-anchor="middle" class="mono">Cusable = Cresponse × Cattribution</text>
  <text x="637" y="655" text-anchor="middle" class="small">Channels retain different semantics until a claim is justified.</text>

  <!-- arrows world -> evidence -->
  <path d="M340 372 C375 350,390 275,435 250" class="arrow"/>
  <path d="M340 372 C390 390,520 300,650 250" class="arrow"/>
  <path d="M340 518 C385 500,400 415,435 380" class="arrow"/>
  <path d="M340 518 C405 535,590 450,650 380" class="arrow"/>
  <path d="M340 663 C390 650,470 600,542 520" class="dash"/>

  <!-- decision contract -->
  <rect x="925" y="170" width="300" height="550" class="box" fill="#fbfbfb"/>
  <rect x="960" y="210" width="230" height="82" class="box" fill="#f4f4f4"/>
  <text x="1075" y="242" text-anchor="middle" class="head">B</text>
  <text x="1075" y="269" text-anchor="middle" class="small">baseline</text>

  <rect x="960" y="325" width="230" height="82" class="box" fill="#dceeff"/>
  <text x="1075" y="357" text-anchor="middle" class="head">T supported</text>
  <text x="1075" y="384" text-anchor="middle" class="small">positive target claim licensed</text>

  <rect x="960" y="440" width="230" height="82" class="box" fill="#ffe6cf"/>
  <text x="1075" y="472" text-anchor="middle" class="head">N supported</text>
  <text x="1075" y="499" text-anchor="middle" class="small">positive nuisance claim licensed</text>

  <rect x="960" y="555" width="230" height="125" class="box" fill="#ece7f8"/>
  <text x="1075" y="590" text-anchor="middle" class="head">U — abstain</text>
  <text x="1075" y="620" text-anchor="middle" class="small">no supported evidence</text>
  <text x="1075" y="646" text-anchor="middle" class="small">or overlap / attribution unresolved</text>

  <path d="M870 445 L925 445" class="arrow"/>

  <!-- claim boundary -->
  <rect x="1270" y="170" width="280" height="550" class="box" fill="#fcfcfc"/>
  <text x="1410" y="210" text-anchor="middle" class="head">Forbidden shortcuts</text>

  <text x="1410" y="265" text-anchor="middle" class="mono">N = 1 − T</text>
  <line x1="1335" y1="250" x2="1485" y2="278" class="forbid"/>

  <text x="1410" y="335" text-anchor="middle" class="mono">O = 1 − N</text>
  <line x1="1338" y1="320" x2="1482" y2="348" class="forbid"/>

  <text x="1410" y="405" text-anchor="middle" class="mono">low T → A−</text>
  <line x1="1335" y1="390" x2="1485" y2="418" class="forbid"/>

  <text x="1410" y="475" text-anchor="middle" class="mono">T + N → error</text>
  <line x1="1328" y1="460" x2="1492" y2="488" class="forbid"/>

  <text x="1410" y="545" text-anchor="middle" class="head">Decision rule</text>
  <text x="1410" y="580" text-anchor="middle" class="body">Control false certainty;</text>
  <text x="1410" y="607" text-anchor="middle" class="body">do not maximize answer rate.</text>

  <text x="1410" y="657" text-anchor="middle" class="small">Field thresholds and absence</text>
  <text x="1410" y="681" text-anchor="middle" class="small">require external validation.</text>

  <!-- bottom development governance -->
  <rect x="55" y="765" width="1495" height="90" class="box" fill="#f8f8f8"/>
  <text x="85" y="800" class="head">Development governance</text>
  <text x="360" y="800" class="body">definition defect</text>
  <text x="570" y="800" class="body">representation defect</text>
  <text x="805" y="800" class="body">no-support / unresolved</text>
  <text x="1045" y="800" class="body">process coupling</text>
  <text x="1265" y="800" class="body">freeze → held-out measure</text>
  <text x="360" y="832" class="small">Failed generations are retained; contradiction type guides the next modification.</text>

  <!-- decisions -> claims -->
  <path d="M1225 445 L1270 445" class="arrow"/>
</svg>
